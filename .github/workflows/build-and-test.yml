# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Approach 1: Cross-compile all 6 variants on a single Linux runner
  # Pros: Fastest, cheapest (1 runner), all builds run sequentially in one job
  # Cons: Cannot run tests (cross-compiled binaries won't execute)
  build-single-runner:
    name: Cross-Compile (Single Runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Build all variants
        run: |
          mkdir -p build
          GOOS=linux   GOARCH=amd64 go build -v -o build/myapp-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -v -o build/myapp-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -v -o build/myapp-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -v -o build/myapp-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -v -o build/myapp-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -v -o build/myapp-windows-arm64.exe .

      - name: Test (native only)
        run: go test -v ./...

  # Approach 2: Cross-compile using matrix on 6 ubuntu-latest runners
  # Pros: Parallel builds, still uses Go cross-compilation
  # Cons: Uses 6 runners, cannot run tests (cross-compiled binaries won't execute)
  build-cross-compile-matrix:
    name: Cross-Compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -v -o build/myapp-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} .

  # Approach 3: Native runners for each OS/arch combination
  # Pros: Can run tests on native architecture, most realistic build environment
  # Cons: Uses 6 different runners, may have longer queue times for some platforms
  build-native:
    name: Native Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
